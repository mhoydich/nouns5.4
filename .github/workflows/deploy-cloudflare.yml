name: Deploy www.industrynext.xyz (Cloudflare Pages)

# Builds the site and deploys public/ to the Cloudflare Pages project
# "industrynext-nouns" (the project that serves www.industrynext.xyz) on every
# push to main. No Mac needed.
#
# One-time setup, in GitHub > Settings > Secrets and variables > Actions:
#   CLOUDFLARE_API_TOKEN   required. A Cloudflare API token with
#                          "Account > Cloudflare Pages > Edit".
#   CLOUDFLARE_ACCOUNT_ID  optional. Only needed if the token can see more
#                          than one Cloudflare account.
# Until the token is added, this workflow builds, checks, and skips the deploy
# step with a notice, so main stays green.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check homepage, start page and services
        run: |
          npm run verify:art-home
          npm run verify:services
          npm run verify:industrynext-overhaul

      - name: Skip deploy (no Cloudflare token yet)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN repository secret to deploy www.industrynext.xyz from GitHub."

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy public --project-name industrynext-nouns --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

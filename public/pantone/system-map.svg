<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">From a color idea to a shared production agreement</title><desc id="desc">An original geometric diagram: an orange circle becomes a numbered reference card, then a stack of sample materials, then an approved specimen. Screen colors are illustrative, not Pantone values.</desc><rect width="1200" height="900" fill="#ece6d7"/><g fill="none" stroke="#252923" stroke-width="2"><path d="M70 100H1130M70 800H1130M600 100V800"/><path d="M355 260H505M695 260H845M355 640H505M695 640H845" stroke-dasharray="8 10"/></g><g fill="#ed643c"><circle cx="280" cy="270" r="147"/><path d="M760 125h320v215H760z"/></g><path fill="#f9f6ee" d="M760 340h320v80H760z"/><g font-family="Arial,sans-serif" fill="#252923"><text x="70" y="65" font-size="22" letter-spacing="4">THE COLOR AGREEMENT / ORIGINAL DIAGRAM</text><text x="785" y="393" font-size="23">REFERENCE + CONDITIONS</text><text x="112" y="465" font-size="25">01 / INTENT</text><text x="760" y="465" font-size="25">02 / SPECIFICATION</text></g><g stroke="#252923" stroke-width="3"><path fill="#a3b4ac" d="M110 565l270-55 65 230-270 55z"/><path fill="#dfad69" d="M140 550l270-22 22 240-270 22z"/><path fill="#ed643c" d="M170 535h270v240H170z"/><circle cx="915" cy="650" r="115" fill="#ed643c"/><path d="M850 650l45 45 90-95" fill="none" stroke-width="15"/></g><g font-family="Arial,sans-serif" fill="#252923"><text x="112" y="850" font-size="25">03 / MATERIAL PROOF</text><text x="760" y="850" font-size="25">04 / SHARED ACCEPTANCE</text><text x="70" y="895" font-size="13">SCREEN ILLUSTRATION · NO PANTONE VALUES · INDUSTRY NEXT / MICHAEL HOYDICH + CODEX / 2026</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Internet People 001 — Tumblr Talent Relay</title><desc id="desc">A purple and acid-yellow talent card describing the Tumblr talent relay.</desc>
  <rect width="1200" height="630" fill="#7559ff"/><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630" stroke="#111" stroke-opacity=".15"/>
  <rect x="45" y="31" width="1110" height="48" fill="#eeff41" stroke="#111" stroke-width="4" transform="rotate(-1 600 55)"/><text x="600" y="63" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" letter-spacing="4" fill="#111">PASS THIS ON / PASS THIS ON / PASS THIS ON</text>
  <text x="72" y="148" font-family="Arial Black, sans-serif" font-size="31" fill="#fff">INTERNET PEOPLE 001</text><text x="72" y="237" font-family="Arial Black, sans-serif" font-size="93" letter-spacing="-7" fill="#fff">THE INTERNET IS</text><text x="72" y="322" font-family="Arial Black, sans-serif" font-size="93" letter-spacing="-7" fill="#fff">FULL OF TALENT.</text><text x="72" y="407" font-family="Arial Black, sans-serif" font-size="93" letter-spacing="-7" fill="#eeff41">BAD AT INTRODUCTIONS.</text>

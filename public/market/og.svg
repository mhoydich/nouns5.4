<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Industry Next Work Market</title>
  <desc id="desc">A bright work market board connecting jobs, tasks, organizations, and reward tokens.</desc>
  <rect width="1200" height="630" fill="#eeff41"/>

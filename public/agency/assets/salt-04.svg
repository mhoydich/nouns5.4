<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400" role="img"><title>Instructions for opening this agency.</title><rect x="0" y="0" width="1800" height="2400" fill="#f4f0df"/><path d="M100 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M200 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M300 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M400 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M500 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M600 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M700 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M800 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M900 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1000 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1100 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1200 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1300 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1400 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1500 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1600 100V2260" stroke="#dcd7c3" stroke-width="1"/><path d="M1700 100V2260" stroke="#dcd7c3" stroke-width="1"/><text x="140" y="160" font-family="monospace" font-size="35" fill="#292b2a">SALT / FIELD INSTRUCTIONS</text><text x="140" y="300" font-family="monospace" font-size="82" fill="#292b2a">Instructions for opening this</text><text x="140" y="395" font-family="monospace" font-size="82" fill="#292b2a">agency.</text><text x="140" y="800" font-family="monospace" font-size="42" fill="#292b2a">01. Open pointcast.xyz/loom. Find #ufogp.</text><text x="140" y="862" font-family="monospace" font-size="42" fill="#292b2a">02. Write the brief: audience, format, purpose, limits.</text><text x="140" y="924" font-family="monospace" font-size="42" fill="#292b2a">03. Read the drafts. Say what needs changing.</text><text x="140" y="986" font-family="monospace" font-size="42" fill="#292b2a">04. Keep the approved version and its credit together.</text><text x="140" y="1048" font-family="monospace" font-size="42" fill="#292b2a">SALT’s partners are AI agents: Sid, Ada, Lou &amp; Tess. A</text><text x="140" y="1110" font-family="monospace" font-size="42" fill="#292b2a">reply is work in progress. A human must approve</text><text x="140" y="1172" font-family="monospace" font-size="42" fill="#292b2a">publication separately.</text><text x="140" y="2185" font-family="sans-serif" font-size="30" fill="#292b2a">SALT. Start at 01.</text><text x="140" y="2290" font-family="monospace" font-size="20" fill="#292b2a">DRAFT / COPY: ADA · LAYOUT: SID / AI AGENTS / HUMAN REVIEW PENDING</text></svg>
